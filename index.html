<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunny Side Studios</title>
  <meta name="description" content="Websites and short videos by Larissa Oliveira." />
  <meta name="theme-color" content="#f6f2e4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta property="og:title" content="Sunny Side Studios" />
  <meta property="og:description" content="Websites and short videos." />
</head>
<body>
  <header class="nav" data-nav>
    <a class="nav-brand" href="#top" aria-label="Sunny Side Studios">
      <span class="nav-word" data-slot="wordmark"></span>
    </a>
    <a class="nav-link" href="#contact">Contact</a>
  </header>

  <main id="top">
    <section class="hero">
      <button class="egg-stage" type="button" data-egg aria-label="Sunny, the egg">
        <span data-slot="egg"></span>
      </button>
      <h1 class="sr-only">Sunny Side Studios: websites and short videos</h1>
    </section>

    <section class="block" id="videos">
      <h2 class="label" data-reveal>Videos</h2>
      <div class="mosaic" data-reveal>
        <div class="mosaic-row row-a">
          <figure class="tile t-tall" tabindex="0" role="button" aria-label="Play Tommy's Cart launch video with sound" data-tile data-name="Tommy's Cart" data-kind="Launch film">
            <video data-video src="/media/tommys-cart-launch.mp4" poster="/media/tommys-cart-launch-poster.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <figcaption><span>Tommy's Cart</span><span>Launch film</span></figcaption>
          </figure>
          <figure class="tile t-wide" tabindex="0" role="button" aria-label="Play Northstar Robotics launch video with sound" data-tile data-name="Northstar Robotics" data-kind="Launch film">
            <video data-video src="/media/northstar.mp4" poster="/media/northstar-poster.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <figcaption><span>Northstar Robotics</span><span>Launch film</span></figcaption>
          </figure>
          <figure class="tile t-tall" tabindex="0" role="button" aria-label="Play DAPCO promo video with sound" data-tile data-name="DAPCO" data-kind="Promo">
            <video data-video src="/media/dapco.mp4" poster="/media/dapco-poster.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <figcaption><span>DAPCO</span><span>Promo</span></figcaption>
          </figure>
        </div>
        <div class="mosaic-row row-b">
          <figure class="tile t-wide" tabindex="0" role="button" aria-label="Play BRASA USC launch video with sound" data-tile data-name="BRASA USC" data-kind="Launch film">
            <video data-video src="/media/brasa-usc.mp4" poster="/media/brasa-usc-poster.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <figcaption><span>BRASA USC</span><span>Launch film</span></figcaption>
          </figure>
          <figure class="tile t-wide" tabindex="0" role="button" aria-label="Play The Brand GPA book trailer with sound" data-tile data-name="The Brand GPA" data-kind="Book trailer">
            <video data-video src="/media/brand-gpa.mp4" poster="/media/brand-gpa-poster.jpg" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <figcaption><span>The Brand GPA</span><span>Book trailer</span></figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="block" id="sites">
      <h2 class="label" data-reveal>Websites</h2>
      <div class="sites">
        <a class="site" href="https://tommyscart.com" target="_blank" rel="noopener" data-reveal>
          <div class="browser">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="view"><img src="/work/tommys-full.webp" alt="tommyscart.com" loading="lazy" /></div>
          </div>
          <div class="caption"><span>tommyscart.com ↗</span></div>
        </a>
        <a class="site" href="https://brasausc.com" target="_blank" rel="noopener" data-reveal>
          <div class="browser">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="view"><img src="/work/brasa-full.webp" alt="brasausc.com" loading="lazy" /></div>
          </div>
          <div class="caption"><span>brasausc.com ↗</span></div>
        </a>
        <a class="site" href="https://vanessacesconetto.com" target="_blank" rel="noopener" data-reveal>
          <div class="browser">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="view"><img src="/work/vanessa-full.webp" alt="vanessacesconetto.com" loading="lazy" /></div>
          </div>
          <div class="caption"><span>vanessacesconetto.com ↗</span></div>
        </a>
        <a class="site" href="https://larissa-oliveira.com" target="_blank" rel="noopener" data-reveal>
          <div class="browser">
            <div class="bar"><i></i><i></i><i></i></div>
            <div class="view"><img src="/work/larissa-full.webp" alt="larissa-oliveira.com" loading="lazy" /></div>
          </div>
          <div class="caption"><span>larissa-oliveira.com ↗</span></div>
        </a>
      </div>
    </section>

    <section class="contact" id="contact">
      <h2 class="contact-title" data-reveal>Let's get cracking.</h2>
      <div class="contact-row" data-reveal>
        <a class="mail" href="mailto:abujamra@usc.edu" data-email>abujamra@usc.edu</a>
        <button class="copy" type="button" data-copy>Copy</button>
      </div>
      <div class="peek" aria-hidden="true" data-slot="egg-peek"></div>
    </section>
  </main>

  <footer class="footer">
    <span>© 2026 Sunny Side Studios</span>
    <a href="https://linkedin.com/in/larissa-oliveira2005" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-stage" role="dialog" aria-modal="true" aria-label="Video">
      <video class="lightbox-video" playsinline loop></video>
      <p class="lightbox-caption"><span data-lb-name></span><span data-lb-kind></span></p>
    </div>
    <button class="lightbox-close" type="button" data-close aria-label="Close video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
